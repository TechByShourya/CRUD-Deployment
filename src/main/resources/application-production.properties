# Production configuration - uses environment variables
# These will be set by your deployment platform

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/ems?useSSL=false&serverTimezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:1234}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Server configuration
server.port=${PORT:8080}

# Logging
logging.level.root=INFO
logging.level.com.example.CRUDapplication=INFO

